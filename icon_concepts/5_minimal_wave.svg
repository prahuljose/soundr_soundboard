<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fff"/>
      <stop offset="40%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <filter id="blur5">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="110"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg5)"/>

  <!-- Blurred blob for depth -->
  <ellipse cx="180" cy="160" rx="160" ry="140" fill="#9d8fff" opacity="0.25" filter="url(#blur5)" clip-path="url(#roundClip)"/>
  <ellipse cx="340" cy="370" rx="140" ry="120" fill="#4338ca" opacity="0.30" filter="url(#blur5)" clip-path="url(#roundClip)"/>

  <!-- Highlight shine top-left -->
  <linearGradient id="shine5" x1="0%" y1="0%" x2="50%" y2="60%">
    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
  </linearGradient>
  <rect width="512" height="512" rx="110" fill="url(#shine5)"/>

  <!-- Clean sine wave — 2 cycles, white -->
  <path
    d="M 60,256
       C 90,196 120,136 152,136
       C 184,136 200,316 232,316
       C 264,316 280,136 312,136
       C 344,136 360,316 392,316
       C 420,316 440,256 452,256"
    fill="none"
    stroke="white"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"/>

  <!-- Small dot at start and end for polish -->
  <circle cx="60"  cy="256" r="9" fill="white" opacity="0.6"/>
  <circle cx="452" cy="256" r="9" fill="white" opacity="0.6"/>
</svg>
