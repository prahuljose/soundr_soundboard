<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c24"/>
      <stop offset="100%" style="stop-color:#1a1545"/>
    </linearGradient>
    <linearGradient id="inf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#c4b5fd"/>
      <stop offset="50%"  style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow6">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg6)"/>

  <!-- Soft halo behind infinity -->
  <ellipse cx="256" cy="256" rx="200" ry="80" fill="#6C63FF" opacity="0.12" filter="url(#softglow6)"/>

  <!-- Infinity symbol path -->
  <!-- Lemniscate approximated with bezier curves, centred at 256,256 -->
  <path
    d="M 256,256
       C 256,206 196,156 136,156
       C 76,156 46,206 46,256
       C 46,306 76,356 136,356
       C 196,356 256,306 256,256
       C 256,206 316,156 376,156
       C 436,156 466,206 466,256
       C 466,306 436,356 376,356
       C 316,356 256,306 256,256 Z"
    fill="none"
    stroke="url(#inf)"
    stroke-width="22"
    stroke-linecap="round"
    filter="url(#glow6)"/>

  <!-- Small sound wave lines through centre -->
  <g transform="translate(256,256)" stroke="white" stroke-linecap="round" fill="none" opacity="0.70">
    <line x1="-14" y1="-22" x2="-14" y2="22" stroke-width="7" rx="4"/>
    <line x1="0"   y1="-34" x2="0"   y2="34" stroke-width="7" rx="4"/>
    <line x1="14"  y1="-22" x2="14"  y2="22" stroke-width="7" rx="4"/>
  </g>
</svg>
