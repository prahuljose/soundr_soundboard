<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#3d35b5"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d9ff"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3d1fa0" flood-opacity="0.5"/>
    </filter>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg3)"/>

  <!-- Subtle noise overlay feel — diagonal highlight -->
  <linearGradient id="shine3" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
    <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
  </linearGradient>
  <rect width="512" height="512" rx="110" fill="url(#shine3)"/>

  <!-- Sound wave arcs behind the S -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-linecap="round" opacity="0.22">
    <path d="M 80,-80 A 113,113 0 0 1 80,80"  stroke-width="10"/>
    <path d="M 104,-104 A 147,147 0 0 1 104,104" stroke-width="8"/>
    <path d="M 128,-128 A 181,181 0 0 1 128,128" stroke-width="6"/>
  </g>

  <!-- Big letter S -->
  <text
    x="218" y="322"
    font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="260"
    fill="url(#sGrad)"
    filter="url(#shadow3)"
    letter-spacing="-10">S</text>
</svg>
