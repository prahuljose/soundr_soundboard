<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#f0e6ff"/>
      <stop offset="40%"  style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <!-- Subtle central glow -->
    <radialGradient id="innerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#innerGlow)"/>

  <!--
    7 bars centred at (256, 248)
    bar w=32 px, gap=14 px → total span = 7×32 + 6×14 = 224+84 = 308 px
    left edge = 256−154 = 102 px,  right edge = 256+154 = 410 px

    Half-heights from centre y=248:
      outer   48 px → top 200, bot 296
      mid-out 78 px → top 170, bot 326
      inner  108 px → top 140, bot 356
      centre 132 px → top 116, bot 380
  -->
  <g transform="translate(256,248)" filter="url(#glow)">
    <rect x="-154" y="-48"  width="32" height="96"  rx="16" fill="url(#barGrad)"/>
    <rect x="-108" y="-78"  width="32" height="156" rx="16" fill="url(#barGrad)"/>
    <rect x="-62"  y="-108" width="32" height="216" rx="16" fill="url(#barGrad)"/>
    <rect x="-16"  y="-132" width="32" height="264" rx="16" fill="url(#barGrad)"/>
    <rect x="30"   y="-108" width="32" height="216" rx="16" fill="url(#barGrad)"/>
    <rect x="76"   y="-78"  width="32" height="156" rx="16" fill="url(#barGrad)"/>
    <rect x="122"  y="-48"  width="32" height="96"  rx="16" fill="url(#barGrad)"/>
  </g>
</svg>
