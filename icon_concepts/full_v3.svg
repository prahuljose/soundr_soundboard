<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
    <!-- Same vivid gradient as the adaptive foreground -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffffff"/>
      <stop offset="35%"  style="stop-color:#ddd6fe"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <!-- Very subtle central glow so the bg isn't flat black -->
    <radialGradient id="innerGlow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#innerGlow)"/>

  <!--
    5 bars centred at (256, 248)
    bar-width=26 px, gap=32 px → total = 5×26 + 4×32 = 258 px
    left = 256−129 = 127 px,  right = 256+129 = 385 px

    Half-heights:
      outer  68 →  top 180, bot 316
      inner 105 →  top 143, bot 353
      centre130 →  top 118, bot 378
  -->
  <g transform="translate(256,248)" filter="url(#glow)">
    <rect x="-129" y="-68"  width="26" height="136" rx="13" fill="url(#barGrad)"/>
    <rect x="-71"  y="-105" width="26" height="210" rx="13" fill="url(#barGrad)"/>
    <rect x="-13"  y="-130" width="26" height="260" rx="13" fill="url(#barGrad)"/>
    <rect x="45"   y="-105" width="26" height="210" rx="13" fill="url(#barGrad)"/>
    <rect x="103"  y="-68"  width="26" height="136" rx="13" fill="url(#barGrad)"/>
  </g>
</svg>
