<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#6C63FF"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg1)"/>

  <!-- Subtle inner glow -->
  <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0"/>
  </radialGradient>
  <rect width="512" height="512" rx="110" fill="url(#innerGlow)"/>

  <!-- Equalizer bars — centred, varying heights -->
  <g transform="translate(256,256)" filter="url(#glow1)">
    <!-- Bar heights (half): 28 45 70 95 115 128 115 95 70 45 28 -->
    <rect x="-135" y="-28"  width="16" height="56"  rx="8" fill="url(#bar1)" opacity="0.55"/>
    <rect x="-108" y="-45"  width="16" height="90"  rx="8" fill="url(#bar1)" opacity="0.65"/>
    <rect x="-81"  y="-70"  width="16" height="140" rx="8" fill="url(#bar1)" opacity="0.75"/>
    <rect x="-54"  y="-95"  width="16" height="190" rx="8" fill="url(#bar1)" opacity="0.85"/>
    <rect x="-27"  y="-115" width="16" height="230" rx="8" fill="url(#bar1)" opacity="0.92"/>
    <rect x="0"    y="-128" width="16" height="256" rx="8" fill="url(#bar1)"/>
    <rect x="27"   y="-115" width="16" height="230" rx="8" fill="url(#bar1)" opacity="0.92"/>
    <rect x="54"   y="-95"  width="16" height="190" rx="8" fill="url(#bar1)" opacity="0.85"/>
    <rect x="81"   y="-70"  width="16" height="140" rx="8" fill="url(#bar1)" opacity="0.75"/>
    <rect x="108"  y="-45"  width="16" height="90"  rx="8" fill="url(#bar1)" opacity="0.65"/>
    <rect x="135"  y="-28"  width="16" height="56"  rx="8" fill="url(#bar1)" opacity="0.55"/>
  </g>
</svg>
