<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#13102b"/>
      <stop offset="100%" style="stop-color:#1e1545"/>
    </linearGradient>
    <linearGradient id="burst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#6C63FF"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg4)"/>

  <!-- Radial burst bars — 12 bars at 30° intervals, varying lengths -->
  <g transform="translate(256,256)" filter="url(#glow4)">
    <rect x="-7" y="-170" width="14" height="80"  rx="7" fill="url(#burst)" opacity="1.0"  transform="rotate(0)"/>
    <rect x="-7" y="-155" width="14" height="55"  rx="7" fill="url(#burst)" opacity="0.75" transform="rotate(30)"/>
    <rect x="-7" y="-185" width="14" height="95"  rx="7" fill="url(#burst)" opacity="0.9"  transform="rotate(60)"/>
    <rect x="-7" y="-148" width="14" height="48"  rx="7" fill="url(#burst)" opacity="0.70" transform="rotate(90)"/>
    <rect x="-7" y="-175" width="14" height="85"  rx="7" fill="url(#burst)" opacity="0.88" transform="rotate(120)"/>
    <rect x="-7" y="-152" width="14" height="52"  rx="7" fill="url(#burst)" opacity="0.72" transform="rotate(150)"/>
    <rect x="-7" y="-170" width="14" height="80"  rx="7" fill="url(#burst)" opacity="1.0"  transform="rotate(180)"/>
    <rect x="-7" y="-155" width="14" height="55"  rx="7" fill="url(#burst)" opacity="0.75" transform="rotate(210)"/>
    <rect x="-7" y="-185" width="14" height="95"  rx="7" fill="url(#burst)" opacity="0.9"  transform="rotate(240)"/>
    <rect x="-7" y="-148" width="14" height="48"  rx="7" fill="url(#burst)" opacity="0.70" transform="rotate(270)"/>
    <rect x="-7" y="-175" width="14" height="85"  rx="7" fill="url(#burst)" opacity="0.88" transform="rotate(300)"/>
    <rect x="-7" y="-152" width="14" height="52"  rx="7" fill="url(#burst)" opacity="0.72" transform="rotate(330)"/>
  </g>

  <!-- Centre dot -->
  <radialGradient id="centreGrad4" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#e0d9ff"/>
    <stop offset="100%" style="stop-color:#6C63FF"/>
  </radialGradient>
  <circle cx="256" cy="256" r="38" fill="url(#centreGrad4)" filter="url(#glow4)"/>
  <circle cx="256" cy="256" r="22" fill="white" opacity="0.95"/>
</svg>
