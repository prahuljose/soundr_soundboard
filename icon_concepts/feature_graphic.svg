<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d0820"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffffff"/>
      <stop offset="35%"  style="stop-color:#ddd6fe"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="22%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.30"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="80%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#leftGlow)"/>
  <rect width="1024" height="500" fill="url(#rightGlow)"/>

  <!--
    Left side: signature 5-bar equalizer mark (icon-anchor)
    Centered vertically at y=250
    bar-width=22, gap=22 → total span = 5*22 + 4*22 = 198
    centered at x=215 → left edge x=116, right edge x=314
  -->
  <g transform="translate(215,250)" filter="url(#glow)">
    <rect x="-99" y="-55"  width="22" height="110" rx="11" fill="url(#barGrad)"/>
    <rect x="-55" y="-85"  width="22" height="170" rx="11" fill="url(#barGrad)"/>
    <rect x="-11" y="-108" width="22" height="216" rx="11" fill="url(#barGrad)"/>
    <rect x="33"  y="-85"  width="22" height="170" rx="11" fill="url(#barGrad)"/>
    <rect x="77"  y="-55"  width="22" height="110" rx="11" fill="url(#barGrad)"/>
  </g>

  <!--
    Right side: text block
    Title: "Soundr" — large, white
    Subtitle: "Soundboard & Audio Tools" — medium, lavender
    Aligned to a column starting at x=380
  -->
  <g>
    <text x="380" y="240"
          font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="120" font-weight="800"
          fill="#ffffff" letter-spacing="-3">Soundr</text>
    <text x="380" y="300"
          font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="32" font-weight="500"
          fill="#c4b5fd" letter-spacing="0.5">Soundboard &amp; Audio Tools</text>

    <!-- Feature chips: small pills listing the headline features -->
    <g transform="translate(380, 340)" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
      <!-- chip 1 -->
      <rect x="0" y="0" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
      <text x="74" y="22" fill="#ddd6fe" text-anchor="middle">149+ Sounds</text>

      <!-- chip 2 -->
      <rect x="160" y="0" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
      <text x="240" y="22" fill="#ddd6fe" text-anchor="middle">Decibel Meter</text>

      <!-- chip 3 -->
      <rect x="332" y="0" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
      <text x="402" y="22" fill="#ddd6fe" text-anchor="middle">Metronome</text>
    </g>

    <!-- "Offline · No ads · No tracking" tagline -->
    <text x="380" y="412"
          font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="500"
          fill="#9ca3af" letter-spacing="1.5">OFFLINE  ·  NO ADS  ·  NO TRACKING</text>
  </g>
</svg>
