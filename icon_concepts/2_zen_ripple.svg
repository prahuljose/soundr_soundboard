<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#0a0612"/>
    </radialGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#6C63FF"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg2)"/>

  <!-- Ripple rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#6C63FF" stroke-width="1.5" opacity="0.18"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#6C63FF" stroke-width="2"   opacity="0.28"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#7c6fff" stroke-width="2.5" opacity="0.40"/>
  <circle cx="256" cy="256" r="78"  fill="none" stroke="#9d95ff" stroke-width="3"   opacity="0.55"/>

  <!-- Glowing centre circle -->
  <circle cx="256" cy="256" r="46" fill="#6C63FF" opacity="0.20" filter="url(#softglow)"/>
  <circle cx="256" cy="256" r="36" fill="url(#accent2)"/>

  <!-- Zen / sound wave symbol inside centre -->
  <!-- Simple horizontal sound wave lines -->
  <g transform="translate(256,256)" stroke="white" stroke-linecap="round" fill="none">
    <path d="M-16,-8 Q-8,-18 0,-8 Q8,2 16,-8"   stroke-width="3"/>
    <path d="M-16, 0 Q-8,-10 0, 0 Q8,10 16, 0"   stroke-width="3"/>
    <path d="M-16, 8 Q-8, 18 0, 8 Q8,-2 16, 8"   stroke-width="3"/>
  </g>
</svg>
